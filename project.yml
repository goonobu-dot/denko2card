name: Denko2Card
options:
  bundleIdPrefix: com.goonobu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ITSAppUsesNonExemptEncryption: false

targets:
  Denko2Card:
    type: application
    platform: iOS
    sources:
      - path: Denko2Card
    resources:
      - path: Denko2Card/Resources/deck
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goonobu.denko2card
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Denko2Card/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES

  Denko2CardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Denko2CardTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.goonobu.denko2card.tests
    dependencies:
      - target: Denko2Card

  Denko2CardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Denko2CardUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.goonobu.denko2card.uitests
    dependencies:
      - target: Denko2Card

schemes:
  Denko2Card:
    build:
      targets:
        Denko2Card: all
        Denko2CardTests: [test]
        Denko2CardUITests: [test]
    test:
      targets:
        - Denko2CardTests
        - Denko2CardUITests
    run:
      config: Debug
